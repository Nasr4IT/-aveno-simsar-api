<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0C373D">
  <script src="assets/js/config.js"></script>
  <script src="assets/js/boot.js"></script>
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <meta property="og:site_name" content="Simsar">
  <title>Simsar</title>
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="hero">
      <div class="container hero-grid">
        <div>
          <h1 class="greet" id="greet"></h1>
          <p class="hero-sub" data-i18n="tagline"></p>
          <form class="search-pill" id="hero-search" action="ads.html" role="search">
            <span id="search-ico"></span>
            <input type="search" name="q" data-i18n-ph="search_ph" data-i18n-aria="search_btn" autocomplete="off">
            <button class="btn btn-primary" type="submit" data-i18n="search_btn"></button>
          </form>
          <div class="cats" id="cats"></div>
        </div>
        <div class="hero-logo-wrap" id="hero-logo"></div>
      </div>
    </section>

    <section id="banners-section" hidden>
      <div class="container"><div class="banners" id="banners"></div></div>
    </section>

    <section id="featured-section" hidden>
      <div class="container">
        <div class="section-head"><h2 data-i18n="featured"></h2><a class="see-all" href="ads.html" data-i18n="see_all"></a></div>
        <div class="rail" id="featured"></div>
      </div>
    </section>

    <section id="popular-section" hidden>
      <div class="container">
        <div class="section-head"><h2 data-i18n="popular"></h2><a class="see-all" href="ads.html?sort=popular" data-i18n="see_all"></a></div>
        <div class="rail mini" id="popular"></div>
      </div>
    </section>

    <section>
      <div class="container">
        <div class="section-head"><h2 data-i18n="latest"></h2><a class="see-all" href="ads.html" data-i18n="see_all"></a></div>
        <div class="grid" id="latest"></div>
      </div>
    </section>

    <section id="features">
      <div class="container">
        <div class="section-head"><h2 data-i18n="features_title"></h2></div>
        <div class="features" id="features-grid"></div>
      </div>
    </section>

    <section>
      <div class="container">
        <div class="section-head"><h2 data-i18n="steps_title"></h2></div>
        <div class="steps">
          <div class="step"><h3 data-i18n="s1"></h3><p data-i18n="s1_d"></p></div>
          <div class="step"><h3 data-i18n="s2"></h3><p data-i18n="s2_d"></p></div>
          <div class="step"><h3 data-i18n="s3"></h3><p data-i18n="s3_d"></p></div>
        </div>
      </div>
    </section>

    <section id="download">
      <div class="container">
        <div class="download">
          <div>
            <h2 data-i18n="dl_title"></h2>
            <p data-i18n="dl_text"></p>
            <div class="store-row" id="download-buttons"></div>
          </div>
          <img class="download-logo" src="assets/img/logo-dark-256.png" alt="">
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/home.js"></script>
</body>
</html>
